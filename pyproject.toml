[project]
name = "ai-agent-lab"
version = "0.6.0"
description = "AI Agent security range — vulnerable target agents + attack scenarios + detection"
authors = [{ name = "longyuanai" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "shared-llm-core",
    "click>=8.1.7,<9.0",
    "rich>=13.7.1,<14.0",
    "jinja2>=3.1.6,<4.0",
]

[project.optional-dependencies]
# Only needed for `LLM_PROVIDER=openai`; the lab runs offline without it.
openai = ["openai>=2.48,<3.0"]

[project.scripts]
ai-agent-lab = "ai_agent_lab.cli:main"

# Loaded at runtime by ai_agent_lab.atlas.registry.load_plugin_tactics().
[project.entry-points."longyuanai.atlas_tactics"]
"AML.T0051" = "ai_agent_lab.atlas.aml_t0051:TACTIC"
"AML.T0051.001" = "ai_agent_lab.atlas.aml_t0051:DIRECT_TACTIC"
"AML.T0051.002" = "ai_agent_lab.atlas.aml_t0051:INDIRECT_TACTIC"
"AML.T0054" = "ai_agent_lab.atlas.aml_t0054:TACTIC"
"AML.T0024" = "ai_agent_lab.atlas.aml_t0024:TACTIC"
"AML.T0050" = "ai_agent_lab.atlas.aml_t0050:TACTIC"
"AML.T0048" = "ai_agent_lab.atlas.aml_t0048:TACTIC"
"AML.T0020" = "ai_agent_lab.atlas.aml_t0020:TACTIC"
"AML.T0031" = "ai_agent_lab.atlas.aml_t0031:TACTIC"
"AML.T0040" = "ai_agent_lab.atlas.aml_t0040:TACTIC"

[tool.poetry]
packages = [{ include = "ai_agent_lab", from = "src" }]
include = ["src/ai_agent_lab/report/template.md"]

# Source override for the sibling checkout. `dependencies` above keeps the
# requirement declared for non-poetry installers; see README for CI layout.
[tool.poetry.dependencies]
shared-llm-core = { path = "../000shared-llm-core", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-mock = "^3.14.0"
ruff = "^0.5.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pythonpath` lets the suite run straight from a checkout, so a broken or
# missing editable install cannot silently take all 200+ tests down with it.
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",
    # SandboxViolation / SandboxTimeout are documented public names; renaming
    # them to *Error would be a breaking API change for no benefit.
    "N818",
    # `(str, Enum)` rather than `StrEnum`, matching the shared-llm-core
    # cross-product Finding/Verdict contract.
    "UP042",
]
