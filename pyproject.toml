[tool.poetry]
name = "ai-agent-lab"
version = "0.1.0"
description = "AI Agent security range — vulnerable target agents + attack scenarios + detection (PoC happy path)"
authors = ["longyuanai"]
license = "MIT"
readme = "README.md"
packages = [{ include = "ai_agent_lab", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
shared-llm-core = { path = "../000shared-llm-core", develop = true }
click = "^8.1.7"
rich = "^13.7.1"
openai = ">=2.48,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-mock = "^3.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
