[tool.poetry]
name = "ai-agent-lab"
version = "0.1.0"
description = "AI Agent security range — vulnerable target agents + attack scenarios + detection (PoC happy path)"
authors = ["longyuanai"]
license = "MIT"
readme = "README.md"
packages = [{ include = "ai_agent_lab", from = "src" }]
include = [
    "src/ai_agent_lab/report/template.md",
    "src/ai_agent_lab/report/benchmark_template.md",
]

[tool.poetry.dependencies]
python = "^3.11"
shared-llm-core = { path = "../000shared-llm-core", develop = true }
click = "^8.1.7"
rich = "^13.7.1"
openai = ">=2.48,<3.0"
jinja2 = "^3.1.6"
fastapi = ">=0.139,<1.0"
pydantic = ">=2.13,<3.0"
uvicorn = ">=0.51,<1.0"
sqlalchemy = ">=2.0.51,<3.0"
alembic = ">=1.18.5,<2.0"
psycopg = { version = ">=3.3.4,<4.0", extras = ["binary"] }
pyjwt = { version = ">=2.13,<3.0", extras = ["crypto"] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-mock = "^3.14.0"
httpx = ">=0.27,<1.0"
ruff = "^0.5.0"

[tool.poetry.scripts]
ai-agent-lab = "ai_agent_lab.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."longyuanai.atlas_tactics"]
"AML.T0010" = "ai_agent_lab.atlas.aml_t0010:TACTIC"
"AML.T0020" = "ai_agent_lab.atlas.aml_t0020:TACTIC"
"AML.T0024" = "ai_agent_lab.atlas.aml_t0024:TACTIC"
"AML.T0025" = "ai_agent_lab.atlas.aml_t0025:TACTIC"
"AML.T0029" = "ai_agent_lab.atlas.aml_t0029:TACTIC"
"AML.T0031" = "ai_agent_lab.atlas.aml_t0031:TACTIC"
"AML.T0040" = "ai_agent_lab.atlas.aml_t0040:TACTIC"
"AML.T0048" = "ai_agent_lab.atlas.aml_t0048:TACTIC"
"AML.T0050" = "ai_agent_lab.atlas.aml_t0050:TACTIC"
"AML.T0051" = "ai_agent_lab.atlas.aml_t0051:TACTIC"
"AML.T0051.001" = "ai_agent_lab.atlas.aml_t0051:DIRECT_TACTIC"
"AML.T0051.002" = "ai_agent_lab.atlas.aml_t0051:INDIRECT_TACTIC"
"AML.T0053" = "ai_agent_lab.atlas.aml_t0053:TACTIC"
"AML.T0054" = "ai_agent_lab.atlas.aml_t0054:TACTIC"
"AML.T0055" = "ai_agent_lab.atlas.aml_t0055:TACTIC"
"AML.T0056" = "ai_agent_lab.atlas.aml_t0056:TACTIC"
"AML.T0057" = "ai_agent_lab.atlas.aml_t0057:TACTIC"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pythonpath` lets the suite run straight from a checkout, so a broken or
# missing editable install cannot silently take every test down with it.
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The TYPE_CHECKING block mirrors the lazy `_EXPORTS` table so type checkers
# and IDEs can still see the real symbols; those imports are unused at runtime
# by design.
"src/ai_agent_lab/__init__.py" = ["F401"]
# FastAPI declares dependencies as `Depends(...)` parameter defaults by design.
"src/ai_agent_lab/api/*.py" = ["B008"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",
    # SandboxViolation / SandboxTimeout are documented public names; renaming
    # them to *Error would be a breaking API change for no benefit.
    "N818",
    # `(str, Enum)` rather than `StrEnum`, matching the shared-llm-core
    # cross-product Finding/Verdict contract.
    "UP042",
]
